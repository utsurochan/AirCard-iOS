name: Build AirCard-iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AirCard
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build app
        run: |
          xcodebuild -project AirCard.xcodeproj -scheme AirCard -sdk iphoneos -configuration Release archive -archivePath build/AirCard.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
          mkdir -p Payload
          mv build/AirCard.xcarchive/Products/Applications/AirCard.app Payload/
          zip -r AirCard.ipa Payload
          rm -rf Payload build

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS
          path: AirCard.ipa
